name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q strategic_graphrag scripts tests
      - name: Check patch whitespace
        run: git diff --check
      - name: Run full Python test suite
        run: python -m pytest -q
      - name: Check deployment gates and smoke scoring
        run: |
          python -m compileall -q deployment
          python -m pytest -q deployment/test_preflight.py deployment/test_live_acceptance.py deployment/test_candidate_import.py
          python deployment/test_complete_fact_scoring.py
          python -m deployment.verify_answer_closure_artifacts
          python deployment/test_validity_portability.py
          python deployment/summarize_service_validity.py --root experiments/service-validity-2026-10-02 --output /tmp/service-summary.json
          python deployment/verify_validity_artifacts.py --root experiments/service-validity-2026-10-02 --recomputed /tmp/service-summary.json
          python deployment/recompute_live.py --raw experiments/public-demo-delivery-2026-09-30/live-http-legacy-v2/requests.jsonl --expected-sha256 63f36fa6ee28515597137a664f7df9465509303458b140415e149b0ddd753ed9

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
